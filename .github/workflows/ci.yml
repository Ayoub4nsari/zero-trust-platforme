name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checkov:
    name: Configuration (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yml

  build-scan:
    name: Build et scan Trivy (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [reservation, notification]
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image
        run: docker build -t zt-${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}
      - name: Scan Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.56.2 image --no-progress --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore --exit-code 1 \
            zt-${{ matrix.service }}:${{ github.sha }}

  publish:
    name: Publication GHCR (${{ matrix.service }})
    needs: [gitleaks, checkov, build-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [reservation, notification]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build et push
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${OWNER,,}/zt-${SERVICE}"
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" "services/${SERVICE}"
          docker push "$IMAGE" --all-tags